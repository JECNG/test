<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>코순이 #2 김장하는 날</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  svg { display: block; }
  text { font-family: 'Gaegu', cursive; font-weight: 700; }
</style>
</head>
<body>
<svg id="c" xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"></svg>
<script>
// ───────── palette ─────────
const INK = '#222';
const SKIN = '#8FA0B0';          // 코순이 회청색
const EAR = '#EE8AA0';           // 코순이 분홍 귀
const BLUSH = '#F4A0B4';
const RED = '#E5483F';
const GLOVE = '#E23B32';
const CREAM = '#F7F1D2';
const LEAF = '#8CC665';
const LW = 5;                    // 기본 외곽선 굵기

// 레이아웃
const W = 491, H = 594;
const PANELS = [[36, 100], [553, 100], [36, 720], [553, 720]];

// seeded rng
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ───────── helpers ─────────
const tube = (d, w, fill, extra = '') =>
  `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + LW * 2}" stroke-linecap="round" stroke-linejoin="round"/>` +
  `<path d="${d}" fill="none" stroke="${fill}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;

function eyes(type) {
  switch (type) {
    case 'sparkle':
      return [-18, 18].map(x =>
        `<circle cx="${x}" cy="-8" r="8" fill="${INK}"/><circle cx="${x + 2.5}" cy="-11" r="3" fill="#fff"/><circle cx="${x - 2.5}" cy="-5" r="1.5" fill="#fff"/>`).join('');
    case 'happy':
      return `<path d="M-27,-5 Q-18,-17 -9,-5 M9,-5 Q18,-17 27,-5" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`;
    case 'smug':
      return `<path d="M-28,-9 Q-18,-1 -8,-9 M8,-9 Q18,-1 28,-9" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>` +
             `<path d="M-28,-19 L-10,-16 M10,-16 L28,-19" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`;
    case 'squeeze':
      return `<path d="M-27,-17 L-12,-9 L-27,-1 M27,-17 L12,-9 L27,-1" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
    case 'tearsmile':
      return `<path d="M-27,-5 Q-18,-17 -9,-5 M9,-5 Q18,-17 27,-5" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>` +
             `<path d="M-30,-2 q-8,13 0,18 q8,-5 0,-18z M30,-2 q-8,13 0,18 q8,-5 0,-18z" fill="#9FD3F2" stroke="${INK}" stroke-width="3"/>`;
    default:
      return `<circle cx="-18" cy="-8" r="6" fill="${INK}"/><circle cx="18" cy="-8" r="6" fill="${INK}"/>`;
  }
}

function mouth(type) {
  switch (type) {
    case 'smile': return `<path d="M-30,30 Q-22,38 -14,31" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`;
    case 'open':  return `<ellipse cx="-14" cy="34" rx="12" ry="10" fill="#8A2B2B" stroke="${INK}" stroke-width="4"/><ellipse cx="-14" cy="39" rx="6" ry="3.5" fill="#E77A86"/>`;
    case 'grin':  return `<path d="M-32,28 Q-22,44 -12,30 Z" fill="#8A2B2B" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`;
    default: return '';
  }
}

// 코끼리 한 마리 (원점 = 머리 중심, 반지름 50 기준)
function ele(o) {
  const skin = o.skin || SKIN, ear = o.ear || EAR;
  const sx = (o.flip ? -1 : 1) * (o.s || 1), sy = o.s || 1;
  let g = `<g transform="translate(${o.x},${o.y}) scale(${sx},${sy})">`;

  // 귀
  g += `<ellipse cx="-56" cy="-4" rx="38" ry="44" fill="${ear}" stroke="${INK}" stroke-width="${LW}"/>`;
  g += `<ellipse cx="56" cy="-4" rx="38" ry="44" fill="${ear}" stroke="${INK}" stroke-width="${LW}"/>`;
  if (o.earFlap) {
    g += `<path d="M-102,-30 Q-110,-4 -102,22 M-114,-20 Q-120,-4 -114,12 M102,-30 Q110,-4 102,22 M114,-20 Q120,-4 114,12" fill="none" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>`;
  }

  // 다리
  const legFill = o.legFill || skin;
  g += `<rect x="-30" y="108" width="22" height="36" rx="9" fill="${legFill}" stroke="${INK}" stroke-width="${LW}"/>`;
  g += `<rect x="8" y="108" width="22" height="36" rx="9" fill="${legFill}" stroke="${INK}" stroke-width="${LW}"/>`;

  // 몸통 + 옷
  const bodyD = 'M-28,38 Q-44,40 -42,70 L-40,118 Q-40,124 -34,124 L34,124 Q40,124 40,118 L42,70 Q44,40 28,38 Z';
  g += `<path d="${bodyD}" fill="${o.bodyFill || skin}" stroke="${INK}" stroke-width="${LW}" stroke-linejoin="round"/>`;
  if (o.outfit === 'grandma') {
    g += `<path d="M-28,38 Q-44,40 -42,70 L-41.4,86 L41.4,86 L42,70 Q44,40 28,38 Z" fill="#B48CC8" stroke="${INK}" stroke-width="${LW}" stroke-linejoin="round"/>`;
    g += `<circle cx="0" cy="56" r="3.5" fill="#fff" stroke="${INK}" stroke-width="2"/><circle cx="0" cy="72" r="3.5" fill="#fff" stroke="${INK}" stroke-width="2"/>`;
  } else if (o.outfit === 'mom') {
    g += `<path d="M-17,44 L17,44 L19,66 L-19,66 Z" fill="#FBE3E8" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`;
    g += `<path d="M-30,64 L30,64 L34,122 L-34,122 Z" fill="#FBE3E8" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`;
    g += `<rect x="-12" y="82" width="24" height="18" rx="4" fill="#F4B8C6" stroke="${INK}" stroke-width="3"/>`;
    g += `<path d="M-30,66 Q-40,72 -44,80 M30,66 Q40,72 44,80" fill="none" stroke="${INK}" stroke-width="3"/>`;
  } else if (o.outfit === 'guard') {
    g += `<path d="M0,40 L0,122" stroke="${INK}" stroke-width="3"/>`;
    g += `<path d="M-22,38 L0,56 L22,38" fill="#5F666E" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`;
    g += `<rect x="-34" y="60" width="22" height="7" rx="2" fill="#5F666E" stroke="${INK}" stroke-width="2.5"/>`;
    g += `<circle cx="20" cy="66" r="5" fill="#F2C94C" stroke="${INK}" stroke-width="2.5"/>`;
  }

  // 팔
  (o.arms || []).forEach(a => {
    const sh = a.side < 0 ? [-30, 52] : [30, 52];
    const d = a.mid ? `M${sh[0]},${sh[1]} Q${a.mid[0]},${a.mid[1]} ${a.to[0]},${a.to[1]}` : `M${sh[0]},${sh[1]} L${a.to[0]},${a.to[1]}`;
    g += tube(d, 13, a.sleeve || skin);
    g += `<circle cx="${a.to[0]}" cy="${a.to[1]}" r="10" fill="${a.glove ? GLOVE : skin}" stroke="${INK}" stroke-width="${LW}"/>`;
    if (a.glove) g += `<path d="M${a.to[0] - 9},${a.to[1] - 13} l18,0" stroke="${INK}" stroke-width="0"/>`;
  });

  // 머리
  g += `<circle cx="0" cy="0" r="50" fill="${skin}" stroke="${INK}" stroke-width="${LW}"/>`;

  // 머리장식
  if (o.hair === 'perm') {
    [[-34, -34], [-20, -46], [-3, -52], [15, -49], [31, -38], [-42, -20], [42, -22], [-10, -38], [9, -38]].forEach(([cx, cy]) =>
      g += `<circle cx="${cx}" cy="${cy}" r="14" fill="#E9E6EE" stroke="${INK}" stroke-width="4"/>`);
    [[-10, -38], [9, -38], [-24, -34], [24, -33]].forEach(([cx, cy]) =>
      g += `<circle cx="${cx}" cy="${cy}" r="11" fill="#E9E6EE"/>`);
  } else if (o.hair === 'bun') {
    g += `<circle cx="0" cy="-60" r="16" fill="#5A3E2B" stroke="${INK}" stroke-width="4"/>`;
    g += `<path d="M-49,-12 C-46,-66 46,-66 49,-12 C30,-34 -30,-34 -49,-12 Z" fill="#5A3E2B" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`;
    g += `<rect x="-11" y="-50" width="22" height="8" rx="4" fill="#F2C94C" stroke="${INK}" stroke-width="3"/>`;
  } else if (o.hair === 'cap') {
    g += `<path d="M-46,-18 C-46,-66 46,-66 46,-18 Z" fill="#3B4A6B" stroke="${INK}" stroke-width="${LW}" stroke-linejoin="round"/>`;
    g += `<path d="M50,-20 Q56,-8 78,-6 Q74,-20 46,-22 Z" fill="#2E3A55" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`;
    g += `<rect x="-52" y="-24" width="100" height="10" rx="5" fill="#2E3A55" stroke="${INK}" stroke-width="4"/>`;
    g += `<circle cx="0" cy="-40" r="7" fill="#F2C94C" stroke="${INK}" stroke-width="3"/>`;
  }

  // 얼굴
  g += eyes(o.eyes);
  const bl = o.blush || BLUSH, br = o.blushBig ? 1.6 : 1;
  g += `<ellipse cx="-31" cy="13" rx="${10 * br}" ry="${6 * br}" fill="${bl}"/><ellipse cx="31" cy="13" rx="${10 * br}" ry="${6 * br}" fill="${bl}"/>`;
  g += mouth(o.mouth);

  // 코
  const trunk = o.trunk || 'M0,2 C0,34 6,54 26,58';
  g += tube(trunk, 17, skin);
  if (o.trunkRed) {
    const t = o.trunkRed; // 0~100: 끝에서부터 빨개진 비율
    g += `<path d="${trunk}" pathLength="100" fill="none" stroke="${RED}" stroke-width="17" stroke-linecap="round" stroke-dasharray="0 ${100 - t} ${t} 0"/>`;
  }
  g += `<circle cx="0" cy="2" r="13" fill="${o.trunkRed >= 100 ? RED : skin}"/>`;
  if (o.trunkLines) g += o.trunkLines;

  if (o.front) g += o.front;
  return g + '</g>';
}

// 배추
function cabbage(x, y, r = 0, s = 1) {
  return `<g transform="translate(${x},${y}) rotate(${r}) scale(${s})">
    <ellipse cx="0" cy="0" rx="18" ry="32" fill="${CREAM}" stroke="${INK}" stroke-width="4.5"/>
    <path d="M-18,-2 Q-20,-32 0,-33 Q20,-32 18,-2 Q12,5 6,-2 Q0,6 -6,-2 Q-12,5 -18,-2 Z" fill="${LEAF}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0,4 L0,26 M-8,6 L-6,22 M8,6 L6,22" stroke="#D6CB98" stroke-width="2.5" stroke-linecap="round"/>
  </g>`;
}

// 말풍선 (외곽선 합집합 트릭)
function bubble(x, y, w, h, text, tail, fs = 36) {
  const cx = x + w / 2, cy = y + h / 2;
  const bx = Math.max(x + h / 2, Math.min(x + w - h / 2, tail[0]));
  const ang = Math.atan2(tail[1] - cy, tail[0] - bx);
  const L = h / 2 + 34; // 꼬리 길이 제한
  const tx = bx + Math.cos(ang) * L, ty = cy + Math.sin(ang) * L;
  const px = Math.cos(ang + Math.PI / 2) * 13, py = Math.sin(ang + Math.PI / 2) * 13;
  const tailD = `M${bx + px},${cy + py} L${tx},${ty} L${bx - px},${cy - py} Z`;
  const rect = (attrs) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h / 2}" ${attrs}/>`;
  const lines = text.split('\n');
  let t = '';
  lines.forEach((ln, i) => {
    const yy = cy + (i - (lines.length - 1) / 2) * fs * 1.08 + fs * 0.34;
    t += `<text x="${cx}" y="${yy}" font-size="${fs}" text-anchor="middle" fill="${INK}">${ln}</text>`;
  });
  return `<g>
    ${rect(`fill="${INK}" stroke="${INK}" stroke-width="${LW * 2}"`)}
    <path d="${tailD}" fill="${INK}" stroke="${INK}" stroke-width="${LW * 2}" stroke-linejoin="round"/>
    ${rect('fill="#fff"')}
    <path d="${tailD}" fill="#fff"/>
    ${t}
  </g>`;
}

// 외침 말풍선 (뾰족)
function shout(cx, cy, rx, ry, text, fs = 40, spikes = 16) {
  let pts = [];
  for (let i = 0; i < spikes * 2; i++) {
    const a = (i / (spikes * 2)) * Math.PI * 2;
    const k = i % 2 ? 0.78 : 1;
    pts.push(`${(cx + Math.cos(a) * rx * k).toFixed(1)},${(cy + Math.sin(a) * ry * k).toFixed(1)}`);
  }
  return `<polygon points="${pts.join(' ')}" fill="#fff" stroke="${INK}" stroke-width="${LW}" stroke-linejoin="round"/>
    <text x="${cx}" y="${cy + fs * 0.34}" font-size="${fs}" text-anchor="middle" fill="${RED}" stroke="${INK}" stroke-width="1.2">${text}</text>`;
}

const sparkle = (x, y, s = 1, fill = '#FFD84D') =>
  `<path transform="translate(${x},${y}) scale(${s})" d="M0,-16 Q2,-2 16,0 Q2,2 0,16 Q-2,2 -16,0 Q-2,-2 0,-16 Z" fill="${fill}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;

const heart = (x, y, s = 1) =>
  `<path transform="translate(${x},${y}) scale(${s})" d="M0,14 C-26,-4 -18,-24 -6,-22 C-2,-21 0,-17 0,-14 C0,-17 2,-21 6,-22 C18,-24 26,-4 0,14 Z" fill="#F0607A" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`;

// ───────── 패널 ─────────
function panel1() {
  let g = '';
  // 바닥
  g += `<path d="M0,556 L${W},556" stroke="${INK}" stroke-width="4"/>`;
  g += `<path d="M30,575 l40,0 M150,582 l30,0 M300,574 l50,0 M420,584 l30,0" stroke="#bbb" stroke-width="3" stroke-linecap="round"/>`;
  // 담장
  g += `<path d="M0,330 L${W},330" stroke="#ccc" stroke-width="3"/>`;
  for (let x = 20; x < W; x += 70) g += `<path d="M${x},330 L${x},300 M${x + 35},330 L${x + 35},300" stroke="#ddd" stroke-width="3"/>`;
  g += `<path d="M0,300 L${W},300" stroke="#ccc" stroke-width="3"/>`;

  // 배추 산더미
  const rows = [[7, 520], [6, 478], [5, 436], [4, 394], [3, 352], [2, 310], [1, 270]];
  const cx = 245;
  for (let ri = rows.length - 1; ri >= 0; ri--) {
    const [n, yy] = rows[ri];
    for (let i = 0; i < n; i++) {
      const xx = cx + (i - (n - 1) / 2) * 56 + (rnd() - 0.5) * 8;
      g += cabbage(xx, yy, 90 + (rnd() - 0.5) * 30 * (i % 2 ? 1 : -1), 1.15);
    }
  }
  // 빨간 고무 대야
  g += `<path d="M18,520 L120,520 L110,556 L28,556 Z" fill="#D94436" stroke="${INK}" stroke-width="${LW}" stroke-linejoin="round"/>`;
  g += `<rect x="12" y="512" width="114" height="14" rx="7" fill="#E25A4B" stroke="${INK}" stroke-width="${LW}"/>`;

  // 엄마 (뒤)
  g += ele({ x: 250, y: 410, s: 1.03, ear: '#E7A0B0', hair: 'bun', outfit: 'mom', bodyFill: '#F6C453',
    eyes: 'happy', mouth: 'smile', arms: [{ side: -1, to: [-54, 92], glove: true, sleeve: '#F6C453' }, { side: 1, to: [56, 90], glove: true, sleeve: '#F6C453' }] });
  // 할머니
  g += ele({ x: 108, y: 414, s: 1.0, ear: '#D9A5B0', hair: 'perm', outfit: 'grandma',
    bodyFill: 'url(#momppe)', legFill: 'url(#momppe)', eyes: 'happy', mouth: 'grin',
    arms: [{ side: -1, to: [-56, 86], glove: true, sleeve: '#B48CC8' }, { side: 1, to: [60, 78], glove: true, sleeve: '#B48CC8' }],
    trunk: 'M0,2 C2,34 -6,52 -26,56' });
  // 코순이 (손 번쩍)
  g += ele({ x: 404, y: 448, s: 0.78, eyes: 'sparkle', mouth: 'grin', earFlap: true,
    arms: [{ side: -1, to: [-50, 92] }, { side: 1, mid: [70, 30], to: [62, -40] }],
    trunk: 'M0,2 C-2,34 -10,52 -30,54' });
  g += sparkle(352, 380, 0.7) + sparkle(470, 392, 0.55) + sparkle(452, 335, 0.45);

  // 시간 캡션
  g += `<rect x="16" y="16" width="236" height="44" rx="6" fill="#FFF6C8" stroke="${INK}" stroke-width="4"/>`;
  g += `<text x="134" y="47" font-size="28" text-anchor="middle" fill="${INK}">2006년 11월, 주말</text>`;

  g += bubble(16, 78, 262, 72, '올해 배추 많네~', [110, 300]);
  g += bubble(248, 176, 226, 72, '나도 할래!!', [400, 330], 38);
  return g;
}

function panel2() {
  let g = '';
  g += `<path d="M0,574 L${W},574" stroke="${INK}" stroke-width="4"/>`;
  // 속도선
  [[300, 120], [330, 80], [362, 140], [398, 96], [430, 120], [462, 70], [496, 110], [530, 90]].forEach(([yy, len], i) =>
    g += `<path d="M${14 + (i % 3) * 10},${yy} l${len},0" stroke="${INK}" stroke-width="${i % 2 ? 3 : 4.5}" stroke-linecap="round"/>`);

  // 할머니 (오른쪽, 일부 잘림)
  g += ele({ x: 452, y: 404, s: 1.15, ear: '#D9A5B0', hair: 'perm', outfit: 'grandma', flip: true,
    bodyFill: 'url(#momppe)', legFill: 'url(#momppe)', eyes: 'happy', mouth: 'grin',
    arms: [{ side: -1, to: [-62, 70], glove: true, sleeve: '#B48CC8' }, { side: 1, mid: [56, 70], to: [40, 20], glove: true, sleeve: '#B48CC8' }],
    trunk: 'M0,2 C2,34 -6,52 -26,56' });

  // 코순이 + 배추 세 포기
  const kx = 196, ky = 404, ks = 1.22;
  g += ele({ x: kx, y: ky, s: ks, eyes: 'smug', mouth: 'grin',
    arms: [{ side: -1, mid: [-62, 60], to: [-40, 92] }, { side: 1, mid: [62, 60], to: [40, 92] }],
    trunk: 'M0,2 C4,40 44,46 58,12 C66,-12 62,-42 50,-66' });
  const tx = kx + 50 * ks, ty = ky - 66 * ks; // 코끝
  g += cabbage(tx - 34, ty - 8, 96, 1.2);
  g += cabbage(tx + 34, ty - 4, 84, 1.2);
  g += cabbage(tx, ty - 48, 90, 1.2);
  // 코가 감싸는 끝
  g += tube(`M${tx - 14},${ty + 12} Q${tx},${ty + 24} ${tx + 16},${ty + 12}`, 14, SKIN);
  g += sparkle(tx - 92, ty - 44, 0.9) + sparkle(tx + 86, ty - 60, 0.75) + sparkle(tx - 118, ty + 8, 0.5);

  g += bubble(16, 22, 300, 74, '한 번에 세 포기!', [150, 300], 38);
  g += bubble(218, 140, 260, 72, '아이고 일꾼이네', [430, 300]);
  return g;
}

function panel3() {
  let g = '';
  // 배경 연한 분홍 + 집중선
  g += `<rect x="0" y="0" width="${W}" height="${H}" fill="#FFF4F2"/>`;
  const ccx = 245, ccy = 340;
  for (let i = 0; i < 70; i++) {
    const a = (i / 70) * Math.PI * 2 + rnd() * 0.05;
    const r0 = 230 + rnd() * 70, r1 = 520;
    const w = 2 + rnd() * 5;
    const x0 = ccx + Math.cos(a) * r0, y0 = ccy + Math.sin(a) * r0;
    const xa = ccx + Math.cos(a + w / r1) * r1, ya = ccy + Math.sin(a + w / r1) * r1;
    const xb = ccx + Math.cos(a - w / r1) * r1, yb = ccy + Math.sin(a - w / r1) * r1;
    g += `<polygon points="${x0},${y0} ${xa},${ya} ${xb},${yb}" fill="${INK}"/>`;
  }
  // 김
  g += `<path d="M175,214 q-14,-16 0,-32 q14,-16 0,-32 M245,200 q-14,-16 0,-32 q14,-16 0,-32 q-10,-12 0,-24 M315,214 q-14,-16 0,-32 q14,-16 0,-32" fill="none" stroke="#8D97A2" stroke-width="10" stroke-linecap="round"/>`;
  g += `<path d="M175,214 q-14,-16 0,-32 q14,-16 0,-32 M245,200 q-14,-16 0,-32 q14,-16 0,-32 q-10,-12 0,-24 M315,214 q-14,-16 0,-32 q14,-16 0,-32" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>`;

  // 코순이 클로즈업 — 코 전체가 새빨갛게
  const trunk = 'M0,2 C10,24 38,30 54,16 C66,6 70,-6 68,-16';
  g += ele({ x: ccx, y: 372, s: 2.25, eyes: 'squeeze', mouth: 'open', blush: '#F26B6B', blushBig: true,
    trunk, trunkRed: 100,
    trunkLines: `<path d="M40,16 l4,10 M52,6 l9,6 M60,-12 l10,2" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`,
    front: `<path d="M-48,-30 q-4,9 0,13 q4,-4 0,-13z M48,-34 q-4,9 0,13 q4,-4 0,-13z" fill="#9FD3F2" stroke="${INK}" stroke-width="2.5"/>` });
  // 땀
  g += `<path d="M395,240 q-10,18 0,24 q10,-6 0,-24z" fill="#9FD3F2" stroke="${INK}" stroke-width="3.5"/>`;

  // 할머니 손 + 겉절이 한 쌈
  g += tube(`M-30,520 Q60,500 150,456`, 30, '#B48CC8');
  g += tube(`M100,478 L150,456`, 30, GLOVE);
  g += `<circle cx="162" cy="452" r="22" fill="${GLOVE}" stroke="${INK}" stroke-width="${LW}"/>`;
  // 쌈
  g += `<g transform="translate(196,446) rotate(-18)">
     <path d="M-30,-6 Q-34,-28 -4,-26 Q22,-26 30,-10 Q36,6 18,12 Q-10,18 -26,8 Z" fill="${LEAF}" stroke="${INK}" stroke-width="4.5" stroke-linejoin="round"/>
